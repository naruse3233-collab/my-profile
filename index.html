<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィールカード</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background:
                radial-gradient(circle at 12% 18%, rgba(125, 211, 252, 0.38), transparent 18%),
                radial-gradient(circle at 88% 82%, rgba(192, 132, 252, 0.32), transparent 22%),
                linear-gradient(30deg, transparent 48%, rgba(255, 255, 255, 0.38) 49%, rgba(255, 255, 255, 0.38) 51%, transparent 52%),
                linear-gradient(150deg, transparent 48%, rgba(255, 255, 255, 0.28) 49%, rgba(255, 255, 255, 0.28) 51%, transparent 52%),
                linear-gradient(135deg, #dff3fb 0%, #f7edf6 48%, #e7e1f7 100%);
            background-size:
                auto,
                auto,
                64px 64px,
                64px 64px,
                auto;
            background-attachment: fixed;
        }

        .card {
            position: relative;
            width: min(760px, 100%);
            margin: 30px auto;
            padding: 30px;
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(252, 250, 255, 0.94));
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow:
                0 24px 60px rgba(74, 70, 90, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            z-index: 1;
            left: 0;
            top: 0;
            width: 200px;
            height: 100%;
            background: linear-gradient(
                180deg,
                #8bd3ec,
                #d8a6c9,
                #9a86d2
            );
            border-radius: 20px 0 0 20px;
        }

        .header {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-left: 110px;
        }

        .header img {
            position: relative;
            z-index: 2;
            width: 280px;
            max-width: 100%;
            height: 200px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.72);
            object-position: center;
            border: 5px solid rgba(255, 255, 255, 0.98);
            border-radius: 28px;
            box-shadow: 0 10px 24px rgba(89, 74, 112, 0.18);
        }

        h1 {
            font-size: 50px;
            writing-mode: horizontal-tb;
            text-orientation: mixed;
            white-space: nowrap;
            letter-spacing: 2px;
            color: #4a4058;
        }

        p {
            font-size: 23px;
            color: #777080;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #6ee10a;
        }

        th {
            font-size: 30px;
            background-color: #dc0e6700;
        }

        td {
            font-size: 20px;
        }

        tr:hover {
            background-color: #f8f0f5;
        }

        .profile-table {
            width: 70%;
            margin-left: 200px;
        }

        .left-bar {
            position: relative;
            z-index: 2;
        }

        .left-text {
            position: absolute;
            z-index: 2;
            left: 20px;
            top: 100px;
            height: 300px;
            writing-mode: vertical-rl;
            font-size: 50px;
            color: white;
        }

        .line1,
        .line2,
        .line3 {
            position: absolute;
        }

        .line1 {
            left: 14px;
            top: 100px;
            width: 15px;
            height: 170px;
            background: linear-gradient(to bottom, #7dd3fc, #c084fc);
        }

        .line2 {
            left: 90px;
            top: 300px;
            width: 30px;
            height: 270px;
            background: linear-gradient(to bottom, #c084fc65, #7df8fc57);
        }

        .line3 {
            left: 30px;
            top: 430px;
            width: 19px;
            height: 250px;
            background: linear-gradient(to bottom, #c084fcd2, #7dfca1c9);
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .card {
                width: 100%;
                margin: 10px auto;
                padding: 20px;
            }

            .card::before {
                width: 100%;
                height: 110px;
                border-radius: 20px 20px 0 0;
                background: linear-gradient(
                    90deg,
                    #87ceeb,
                    #ffb6c1,
                    #9370db
                );
            }

            .header {
                flex-direction: column;
                margin: 0;
                gap: 12px;
                text-align: center;
            }

            .header img {
                width: 180px;
                height: 180px;
                border: 6px solid rgba(255, 255, 255, 0.9);
            }

            h1 {
                margin: 10px 0 4px;
                font-size: 36px;
            }

            p {
                margin: 0;
                font-size: 18px;
            }

            .profile-table {
                width: 100%;
                margin: 20px 0 0;
            }

            th {
                width: 42%;
                font-size: 20px;
            }

            td {
                font-size: 16px;
            }

            .left-bar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="left-bar">
            <div class="left-text">My Profile</div>
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>

        <div class="header">
            <img src="PXL_20261029_063809936.jpg" alt="プロフィール画像">
            <div>
                <h1>成瀬</h1>
                <p>HTML / CSS Learner</p>
            </div>
        </div>

        <table class="profile-table">
            <tr>
                <th>誕生日</th>
                <td>11月24日</td>
            </tr>
            
            <tr>
                <th>出身地</th>
                <td>愛知県</td>
            </tr>
            <tr>
                <th>趣味</th>
                <td>ゲーム<br>ランニング</td>
            </tr>
            <tr>
                <th>使用技術</th>
                <td>HTML, CSS</td>
            </tr>
            <tr>
                <th>実績</th>
                <td><a href="file:///C:/Users/narus/OneDrive/Desktop/%E7%B7%B4%E7%BF%922/index.html">ゲーム紹介サイト</a></td>
            </tr>
            <tr>
                <th>ひとこと</th>
                <td>Web制作を学習中です。
                   <br>見やすく使いやすい<br>サイト制作を目指しています。
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
